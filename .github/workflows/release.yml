name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cli_bin: pages-cli
            gui_bin: pages
            cli_archive: pages-cli-linux-x86_64.tar.gz
            gui_archive: pages-gui-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cli_bin: pages-cli.exe
            gui_bin: pages.exe
            cli_archive: pages-cli-windows-x86_64.zip
            gui_archive: pages-gui-windows-x86_64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux Desktop Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Web Frontend Assets
        run: |
          bun install
          bun run build

      - name: Build Pages CLI & GUI Release Binaries
        run: |
          cargo build --release --target ${{ matrix.target }} -p pages-cli
          cargo build --release --target ${{ matrix.target }} -p pages-gui

      - name: Package Release Archives (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.cli_archive }} ${{ matrix.cli_bin }} ../../../README.md ../../../LICENSE
          tar -czvf ../../../${{ matrix.gui_archive }} ${{ matrix.gui_bin }} ../../../README.md ../../../LICENSE
          cd ../../..

      - name: Package Release Archives (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path target\${{ matrix.target }}\release\${{ matrix.cli_bin }}, README.md, LICENSE -DestinationPath ${{ matrix.cli_archive }}
          Compress-Archive -Path target\${{ matrix.target }}\release\${{ matrix.gui_bin }}, README.md, LICENSE -DestinationPath ${{ matrix.gui_archive }}

      - name: Upload CLI Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: ${{ matrix.cli_archive }}

      - name: Upload GUI Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.target }}
          path: ${{ matrix.gui_archive }}

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
