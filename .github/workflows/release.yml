name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cli_asset: pages-cli-linux-x86_64.tar.gz
            gui_asset: pages-gui-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cli_asset: pages-cli.exe
            gui_asset: Pages-Setup.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux Desktop Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libglib2.0-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Web Frontend Assets
        run: |
          bun install
          bun run build

      - name: Build Pages CLI & GUI (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build --release --target ${{ matrix.target }} -p pages-cli
          cargo build --release --target ${{ matrix.target }} -p pages-gui

      - name: Build Pages CLI & GUI Installer (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cargo build --release --target ${{ matrix.target }} -p pages-cli
          bun run tauri build --target ${{ matrix.target }} --bundles nsis

      - name: Package Release Archives (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.cli_asset }} pages-cli ../../../README.md ../../../LICENSE
          tar -czvf ../../../${{ matrix.gui_asset }} pages ../../../README.md ../../../LICENSE
          cd ../../..

      - name: Prepare Windows Executables (.exe)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Copy standalone portable CLI executable (no installation required)
          Copy-Item target\${{ matrix.target }}\release\pages-cli.exe -Destination pages-cli.exe

          # Locate and copy GUI NSIS Installer .exe (installer required)
          $nsis = Get-ChildItem -Path "target\**\bundle\nsis\*.exe" -Recurse | Select-Object -First 1
          if (-not $nsis) {
            Write-Error "NSIS setup installer .exe was not found in target bundle directory!"
            exit 1
          }
          Write-Host "Found NSIS Installer: $($nsis.FullName)"
          Copy-Item $nsis.FullName -Destination Pages-Setup.exe

      - name: Upload CLI Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: ${{ matrix.cli_asset }}

      - name: Upload GUI Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.target }}
          path: ${{ matrix.gui_asset }}

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
