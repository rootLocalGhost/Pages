[package]
name = "pages-gui"
version.workspace = true
description = "Pages — Document Studio"
edition = "2021"
authors = ["Pages Team"]
license = "MIT"

[lib]
name = "pages_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pages"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
image = { workspace = true }
pages-core = { path = "../crates/pages-core" }
pages-imageproc = { path = "../crates/pages-imageproc" }
pages-dewarp = { path = "../crates/pages-dewarp" }
pages-math = { path = "../crates/pages-math" }
base64 = "0.22"
num_cpus = "1.16"
tokio = { version = "1", features = ["full"] }
