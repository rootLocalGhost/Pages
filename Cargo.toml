[workspace]
resolver = "2"
members = [
    "crates/pages-math",
    "crates/pages-imageproc",
    "crates/pages-dewarp",
    "crates/pages-core",
    "crates/pages-cli",
    "src-tauri",
]
exclude = [
    "ScanSmith-AI/src-tauri",
]

[workspace.package]
version = "6.0.0"
edition = "2021"
authors = ["Pages Team"]
license = "MIT"

[workspace.dependencies]
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
clap = { version = "4.5", features = ["derive"] }
approx = "0.5"
