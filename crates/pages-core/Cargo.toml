[package]
name = "pages-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
ai = ["dep:ort"]
directml = ["ai", "ort/directml", "ort/lax-feature-matching"]
openvino = ["ai", "ort/openvino", "ort/lax-feature-matching"]

[dependencies]
pages-math = { path = "../pages-math" }
pages-imageproc = { path = "../pages-imageproc" }
pages-dewarp = { path = "../pages-dewarp" }
image.workspace = true
rayon.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
ort = { version = "2.0.0-rc.13", optional = true }
